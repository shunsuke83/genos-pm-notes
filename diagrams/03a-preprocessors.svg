<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="원본 파일이 전처리기 종류에 따라 다른 방식으로 청크가 되어 임베딩·저장되는 경로" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l3a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l3a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l3a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="30" y="90" width="110" height="50" rx="6" class="fig-box "/><text x="85" y="111.5" text-anchor="middle" class="fig-t">원본 파일</text><text x="85" y="126.5" text-anchor="middle" class="fig-t sub">PDF·HWP·DOCX</text><polyline points="140,105 200,45" class="fig-l " marker-end="url(#l3a-a)"/><polyline points="140,115 200,115" class="fig-l " marker-end="url(#l3a-a)"/><polyline points="140,125 200,185" class="fig-l " marker-end="url(#l3a-a)"/><text x="200" y="14" text-anchor="start" class="fig-m">속도 중심</text><rect x="200" y="20" width="160" height="50" rx="6" class="fig-box "/><text x="280" y="41.5" text-anchor="middle" class="fig-t">첨부용</text><text x="280" y="56.5" text-anchor="middle" class="fig-t sub">다양한 포맷 · OCR 없음</text><polyline points="360,45 410,45" class="fig-l " marker-end="url(#l3a-a)"/><rect x="410" y="20" width="190" height="50" rx="6" class="fig-box "/><text x="505" y="41.5" text-anchor="middle" class="fig-t">글자 수로 분할</text><text x="505" y="56.5" text-anchor="middle" class="fig-t sub">chunk_size 1000 · overlap 100</text><text x="200" y="84" text-anchor="start" class="fig-m">호환성 중심</text><rect x="200" y="90" width="160" height="50" rx="6" class="fig-box "/><text x="280" y="111.5" text-anchor="middle" class="fig-t">변환용</text><text x="280" y="126.5" text-anchor="middle" class="fig-t sub">PDF로 변환 · OCR 선택</text><polyline points="360,115 410,115" class="fig-l " marker-end="url(#l3a-a)"/><rect x="410" y="90" width="190" height="50" rx="6" class="fig-box "/><text x="505" y="111.5" text-anchor="middle" class="fig-t">섹션 분할 후 병합</text><text x="505" y="126.5" text-anchor="middle" class="fig-t sub">2,000 토큰 안에서 합침</text><text x="200" y="154" text-anchor="start" class="fig-m">품질 중심</text><rect x="200" y="160" width="160" height="50" rx="6" class="fig-box hi"/><text x="280" y="181.5" text-anchor="middle" class="fig-t">적재용 지능형</text><text x="280" y="196.5" text-anchor="middle" class="fig-t sub">PDF 전용 · 레이아웃 분석</text><polyline points="360,185 410,185" class="fig-l hi" marker-end="url(#l3a-ah)"/><rect x="410" y="160" width="190" height="50" rx="6" class="fig-box hi"/><text x="505" y="181.5" text-anchor="middle" class="fig-t">섹션 단위 그대로</text><text x="505" y="196.5" text-anchor="middle" class="fig-t sub">병합도 추가 분할도 없음</text><polyline points="600,45 650,105" class="fig-l " marker-end="url(#l3a-a)"/><polyline points="600,115 650,115" class="fig-l " marker-end="url(#l3a-a)"/><polyline points="600,185 650,125" class="fig-l hi" marker-end="url(#l3a-ah)"/><rect x="650" y="90" width="80" height="50" rx="6" class="fig-box "/><text x="690" y="119" text-anchor="middle" class="fig-t">임베딩</text><polyline points="730,115 760,115" class="fig-l " marker-end="url(#l3a-a)"/><rect x="760" y="90" width="80" height="50" rx="6" class="fig-box "/><text x="800" y="119" text-anchor="middle" class="fig-t">벡터 DB</text></svg>