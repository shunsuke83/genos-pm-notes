<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="AI 드라이브 문서가 업로드·완료·재적재 대상·휴지통 상태를 오가는 흐름" viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l3b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l3b-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l3b-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="30" y="110" width="100" height="44" rx="6" class="fig-box "/><text x="80" y="136" text-anchor="middle" class="fig-t">업로드</text><polyline points="130,132 170,132" class="fig-l " marker-end="url(#l3b-a)"/><rect x="170" y="110" width="100" height="44" rx="6" class="fig-box "/><text x="220" y="128.5" text-anchor="middle" class="fig-t">적재 중</text><text x="220" y="143.5" text-anchor="middle" class="fig-t sub">검색 제외</text><polyline points="270,132 310,132" class="fig-l " marker-end="url(#l3b-a)"/><rect x="310" y="110" width="110" height="44" rx="6" class="fig-box ok"/><text x="365" y="128.5" text-anchor="middle" class="fig-t">완료</text><text x="365" y="143.5" text-anchor="middle" class="fig-t sub">검색·참조 대상</text><polyline points="420,132 480,132" class="fig-l " marker-end="url(#l3b-a)"/><text x="450" y="172" text-anchor="middle" class="fig-lab">같은 이름 덮어쓰기 · 설정 변경</text><rect x="480" y="110" width="150" height="44" rx="6" class="fig-box bad"/><text x="555" y="128.5" text-anchor="middle" class="fig-t">재적재 대상</text><text x="555" y="143.5" text-anchor="middle" class="fig-t sub">재적재 전 내용: 확인 필요</text><polyline points="555,154 555,210 220,210 220,154" class="fig-l " marker-end="url(#l3b-a)"/><text x="390" y="226" text-anchor="middle" class="fig-lab">[재적재] 실행 → 최신 설정으로 다시 적재</text><polyline points="365,110 365,64" class="fig-l " marker-end="url(#l3b-a)"/><text x="372" y="90" text-anchor="start" class="fig-lab">삭제</text><rect x="310" y="20" width="110" height="44" rx="6" class="fig-box "/><text x="365" y="38.5" text-anchor="middle" class="fig-t">휴지통</text><text x="365" y="53.5" text-anchor="middle" class="fig-t sub">검색 인덱스에서 제거</text><polyline points="420,42 480,42" class="fig-l " marker-end="url(#l3b-a)"/><text x="450" y="34" text-anchor="middle" class="fig-lab">30일 경과</text><rect x="480" y="20" width="150" height="44" rx="6" class="fig-box "/><text x="555" y="38.5" text-anchor="middle" class="fig-t">영구 삭제</text><text x="555" y="53.5" text-anchor="middle" class="fig-t sub">복원 불가</text><polyline points="310,42 220,42 220,110" class="fig-l " marker-end="url(#l3b-a)"/><text x="250" y="34" text-anchor="middle" class="fig-lab">복원 → 자동 재적재</text><polyline points="80,154 80,190" class="fig-l dash" marker-end="url(#l3b-a)"/><text x="90" y="176" text-anchor="start" class="fig-lab">같은 이름 → '두 파일 모두 유지'</text><rect x="30" y="190" width="160" height="44" rx="6" class="fig-box "/><text x="110" y="208.5" text-anchor="middle" class="fig-t">사본 (1) 별개 문서</text><text x="110" y="223.5" text-anchor="middle" class="fig-t sub">구판과 함께 검색될 수 있음</text></svg>