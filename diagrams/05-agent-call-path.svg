<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="에이전트의 도구 호출이 에이전트 게이트웨이를 거쳐 MCP 서버와 고객 시스템에 닿는 경로" viewBox="0 0 870 320" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l5-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l5-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l5-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="30" y="60" width="110" height="44" rx="6" class="fig-box "/><text x="85" y="86" text-anchor="middle" class="fig-t">채팅 앱</text><polyline points="140,82 180,82" class="fig-l " marker-end="url(#l5-a)"/><rect x="180" y="60" width="140" height="44" rx="6" class="fig-box "/><text x="250" y="78.5" text-anchor="middle" class="fig-t">에이전트플로우</text><text x="250" y="93.5" text-anchor="middle" class="fig-t sub">LLM이 도구를 고름</text><polyline points="320,82 370,82" class="fig-l " marker-end="url(#l5-a)"/><text x="345" y="74" text-anchor="middle" class="fig-lab">도구 호출</text><rect x="370" y="40" width="160" height="90" rx="6" class="fig-box hi"/><text x="450" y="66.5" text-anchor="middle" class="fig-t">에이전트 게이트웨이</text><text x="450" y="81.5" text-anchor="middle" class="fig-t sub">① 비상 차단 여부</text><text x="450" y="96.5" text-anchor="middle" class="fig-t sub">② 허용 여부 (라벨·호출자)</text><text x="450" y="111.5" text-anchor="middle" class="fig-t sub">③ 분당 호출 한도</text><polyline points="530,82 580,82" class="fig-l " marker-end="url(#l5-a)"/><rect x="580" y="60" width="110" height="44" rx="6" class="fig-box "/><text x="635" y="78.5" text-anchor="middle" class="fig-t">MCP 서버</text><text x="635" y="93.5" text-anchor="middle" class="fig-t sub">결재 후 online</text><polyline points="690,82 730,82" class="fig-l " marker-end="url(#l5-a)"/><rect x="710" y="50" width="150" height="64" rx="6" class="fig-box "/><text x="785" y="71" text-anchor="middle" class="fig-t">MCP 도구</text><text x="785" y="86" text-anchor="middle" class="fig-t sub">행위 라벨 · 개인정보 유형</text><text x="785" y="101" text-anchor="middle" class="fig-t sub">라벨 없으면 정책 미적용</text><polyline points="785,114 785,180" class="fig-l " marker-end="url(#l5-a)"/><text x="775" y="150" text-anchor="end" class="fig-lab">API 호출 · 재시도·멱등 주체는 확인 필요</text><rect x="710" y="180" width="150" height="44" rx="6" class="fig-box "/><text x="785" y="206" text-anchor="middle" class="fig-t">고객 업무 시스템</text><polyline points="250,104 250,170" class="fig-l " marker-end="url(#l5-a)"/><text x="258" y="140" text-anchor="start" class="fig-lab">모델 호출</text><rect x="180" y="170" width="140" height="44" rx="6" class="fig-box "/><text x="250" y="188.5" text-anchor="middle" class="fig-t">서비스 라우터</text><text x="250" y="203.5" text-anchor="middle" class="fig-t sub">규칙 기반 라우팅</text><polyline points="180,192 140,192" class="fig-l bad" marker-end="url(#l5-ab)"/><text x="160" y="232" text-anchor="middle" class="fig-lab">개인정보 도구가 쓰인 턴이면 차단</text><rect x="30" y="170" width="110" height="44" rx="6" class="fig-box "/><text x="85" y="196" text-anchor="middle" class="fig-t">외부 API 모델</text><rect x="180" y="260" width="140" height="44" rx="6" class="fig-box "/><text x="250" y="286" text-anchor="middle" class="fig-t">마스터 에이전트</text><polyline points="320,282 580,282" class="fig-l " marker-end="url(#l5-a)"/><text x="450" y="274" text-anchor="middle" class="fig-lab">tasks/send → input-required → 확인 → 재호출</text><rect x="580" y="260" width="110" height="44" rx="6" class="fig-box "/><text x="635" y="278.5" text-anchor="middle" class="fig-t">A2A 서브에이전트</text><text x="635" y="293.5" text-anchor="middle" class="fig-t sub">워크플로우 노출</text><polyline points="450,130 450,282" class="fig-l dash"/><text x="458" y="230" text-anchor="start" class="fig-m">A2A도 같은 통제</text></svg>