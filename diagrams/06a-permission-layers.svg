<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="사용자가 워크스페이스·관리 그룹·역할·채팅 앱 권한을 지나 보안등급 필터가 적용된 검색 결과를 받는 순서" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l6a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l6a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l6a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><text x="30" y="50" text-anchor="start" class="fig-m">누가 들어오나</text><polyline points="30,56 237,56" class="fig-l dash"/><text x="258" y="50" text-anchor="start" class="fig-m">무엇을 할 수 있나</text><polyline points="258,56 578,56" class="fig-l dash"/><text x="599" y="50" text-anchor="start" class="fig-m">무엇을 보나</text><polyline points="599,56 855,56" class="fig-l dash"/><rect x="30" y="80" width="100" height="50" rx="6" class="fig-box "/><text x="80" y="101.5" text-anchor="middle" class="fig-t">사용자 계정</text><text x="80" y="116.5" text-anchor="middle" class="fig-t sub">활성화 Y/N</text><polyline points="130,105 137,105" class="fig-l " marker-end="url(#l6a-a)"/><rect x="137" y="80" width="100" height="50" rx="6" class="fig-box "/><text x="187" y="101.5" text-anchor="middle" class="fig-t">워크스페이스</text><text x="187" y="116.5" text-anchor="middle" class="fig-t sub">활성 하나 기준</text><polyline points="237,105 258,105" class="fig-l " marker-end="url(#l6a-a)"/><rect x="258" y="80" width="100" height="50" rx="6" class="fig-box "/><text x="308" y="101.5" text-anchor="middle" class="fig-t">관리 그룹</text><text x="308" y="116.5" text-anchor="middle" class="fig-t sub">부서 단위</text><polyline points="358,105 368,105" class="fig-l " marker-end="url(#l6a-a)"/><rect x="368" y="80" width="100" height="50" rx="6" class="fig-box "/><text x="418" y="101.5" text-anchor="middle" class="fig-t">역할 · 정책</text><text x="418" y="116.5" text-anchor="middle" class="fig-t sub">메뉴·리소스 R/RW</text><polyline points="468,105 478,105" class="fig-l " marker-end="url(#l6a-a)"/><rect x="478" y="80" width="100" height="50" rx="6" class="fig-box "/><text x="528" y="101.5" text-anchor="middle" class="fig-t">채팅 앱 권한</text><text x="528" y="116.5" text-anchor="middle" class="fig-t sub">모든 사용자 · 지정</text><polyline points="578,105 599,105" class="fig-l " marker-end="url(#l6a-a)"/><rect x="599" y="80" width="140" height="50" rx="6" class="fig-box hi"/><text x="669" y="101.5" text-anchor="middle" class="fig-t">검색 단계 필터</text><text x="669" y="116.5" text-anchor="middle" class="fig-t sub">문서 등급 > 유효 등급 제외</text><polyline points="739,105 749,105" class="fig-l hi" marker-end="url(#l6a-ah)"/><rect x="749" y="80" width="106" height="50" rx="6" class="fig-box "/><text x="802" y="101.5" text-anchor="middle" class="fig-t">LLM → 답변·출처</text><text x="802" y="116.5" text-anchor="middle" class="fig-t sub">제외 문서는 안 섞임</text><text x="669" y="160" text-anchor="middle" class="fig-m">유효 등급 = 관리 그룹·역할·사용자 지정 중 가장 높은 것</text><text x="669" y="180" text-anchor="middle" class="fig-m">등급 삭제 시 그 문서는 공개(레벨 0)로 바뀜</text><text x="190" y="160" text-anchor="middle" class="fig-m">결재: 배포·인증 키·공유·이관 신청을 승인</text></svg>