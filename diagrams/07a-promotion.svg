<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="개발망에서 만든 워크플로우가 결재와 브리지 Git을 거쳐 운영망에 반입되는 흐름" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l7a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l7a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l7a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="50" width="340" height="150" rx="8" class="fig-region "/><text x="30" y="66" class="fig-m">개발망</text><rect x="500" y="50" width="340" height="150" rx="8" class="fig-region "/><text x="510" y="66" class="fig-m">운영망</text><rect x="40" y="100" width="130" height="50" rx="6" class="fig-box "/><text x="105" y="121.5" text-anchor="middle" class="fig-t">워크플로우</text><text x="105" y="136.5" text-anchor="middle" class="fig-t sub">작성 · 검증</text><polyline points="170,125 210,125" class="fig-l " marker-end="url(#l7a-a)"/><rect x="210" y="100" width="130" height="50" rx="6" class="fig-box "/><text x="275" y="121.5" text-anchor="middle" class="fig-t">전용 승격</text><text x="275" y="136.5" text-anchor="middle" class="fig-t sub">이관 신청 (JSON)</text><polyline points="340,115 360,115 360,42 380,42" class="fig-l " marker-end="url(#l7a-a)"/><text x="346" y="70" text-anchor="start" class="fig-lab">신청</text><rect x="380" y="20" width="100" height="44" rx="6" class="fig-box hi"/><text x="430" y="38.5" text-anchor="middle" class="fig-t">운영 > 결재</text><text x="430" y="53.5" text-anchor="middle" class="fig-t sub">승인</text><polyline points="430,64 430,100" class="fig-l " marker-end="url(#l7a-a)"/><text x="440" y="86" text-anchor="start" class="fig-lab">승인 후 시스템이 반출</text><rect x="380" y="100" width="100" height="50" rx="6" class="fig-box "/><text x="430" y="121.5" text-anchor="middle" class="fig-t">브리지 Git</text><text x="430" y="136.5" text-anchor="middle" class="fig-t sub">PAT 필요</text><polyline points="480,125 520,125" class="fig-l " marker-end="url(#l7a-a)"/><rect x="520" y="100" width="150" height="50" rx="6" class="fig-box "/><text x="595" y="121.5" text-anchor="middle" class="fig-t">반입 (관리자)</text><text x="595" y="136.5" text-anchor="middle" class="fig-t sub">같은 이름 워크플로우 준비</text><polyline points="670,125 690,125" class="fig-l " marker-end="url(#l7a-a)"/><rect x="690" y="100" width="130" height="50" rx="6" class="fig-box "/><text x="755" y="121.5" text-anchor="middle" class="fig-t">리소스 매핑 → 적용</text><text x="755" y="136.5" text-anchor="middle" class="fig-t sub">서빙·벡터DB·용어사전·MCP</text><text x="755" y="172" text-anchor="middle" class="fig-lab bad">매핑 누락 → 적용 실패</text><text x="755" y="188" text-anchor="middle" class="fig-m">(이관 이력 탭의 실패 로그)</text><text x="105" y="172" text-anchor="middle" class="fig-m">검수 ①</text><text x="595" y="172" text-anchor="middle" class="fig-m">운영망 재검수 ②</text></svg>