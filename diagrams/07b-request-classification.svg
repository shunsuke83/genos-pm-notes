<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="고객 요청을 네 가지 질문으로 기본 제공·설정·추가 개발·외부 연동·확인 필요로 나누는 흐름" viewBox="0 0 860 210" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l7b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l7b-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l7b-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="40" width="150" height="50" rx="6" class="fig-box "/><text x="95" y="61.5" text-anchor="middle" class="fig-t">메뉴에서</text><text x="95" y="76.5" text-anchor="middle" class="fig-t sub">바로 되는가?</text><polyline points="170,65 210,65" class="fig-l " marker-end="url(#l7b-a)"/><text x="190" y="57" text-anchor="middle" class="fig-lab">아니오</text><rect x="210" y="40" width="150" height="50" rx="6" class="fig-box "/><text x="285" y="61.5" text-anchor="middle" class="fig-t">화면 값만</text><text x="285" y="76.5" text-anchor="middle" class="fig-t sub">바꾸면 되는가?</text><polyline points="360,65 400,65" class="fig-l " marker-end="url(#l7b-a)"/><text x="380" y="57" text-anchor="middle" class="fig-lab">아니오</text><rect x="400" y="40" width="150" height="50" rx="6" class="fig-box "/><text x="475" y="61.5" text-anchor="middle" class="fig-t">GenOS 안에서</text><text x="475" y="76.5" text-anchor="middle" class="fig-t sub">코드를 짜면 되는가?</text><polyline points="550,65 590,65" class="fig-l " marker-end="url(#l7b-a)"/><text x="570" y="57" text-anchor="middle" class="fig-lab">아니오</text><rect x="590" y="40" width="150" height="50" rx="6" class="fig-box "/><text x="665" y="61.5" text-anchor="middle" class="fig-t">고객 시스템이</text><text x="665" y="76.5" text-anchor="middle" class="fig-t sub">바뀌어야 하는가?</text><polyline points="740,65 780,65" class="fig-l " marker-end="url(#l7b-a)"/><text x="760" y="57" text-anchor="middle" class="fig-lab">아니오</text><rect x="780" y="40" width="70" height="50" rx="6" class="fig-box bad"/><text x="815" y="61.5" text-anchor="middle" class="fig-t">확인</text><text x="815" y="76.5" text-anchor="middle" class="fig-t sub">필요</text><polyline points="95,90 95,130" class="fig-l " marker-end="url(#l7b-a)"/><text x="103" y="115" text-anchor="start" class="fig-lab">예</text><rect x="20" y="130" width="150" height="44" rx="6" class="fig-box ok"/><text x="95" y="156" text-anchor="middle" class="fig-t">기본 제공</text><polyline points="285,90 285,130" class="fig-l " marker-end="url(#l7b-a)"/><text x="293" y="115" text-anchor="start" class="fig-lab">예</text><rect x="210" y="130" width="150" height="44" rx="6" class="fig-box ok"/><text x="285" y="156" text-anchor="middle" class="fig-t">설정</text><polyline points="475,90 475,130" class="fig-l " marker-end="url(#l7b-a)"/><text x="483" y="115" text-anchor="start" class="fig-lab">예</text><rect x="400" y="130" width="150" height="44" rx="6" class="fig-box hi"/><text x="475" y="148.5" text-anchor="middle" class="fig-t">추가 개발</text><text x="475" y="163.5" text-anchor="middle" class="fig-t sub">개발 공수</text><polyline points="665,90 665,130" class="fig-l " marker-end="url(#l7b-a)"/><text x="673" y="115" text-anchor="start" class="fig-lab">예</text><rect x="590" y="130" width="150" height="44" rx="6" class="fig-box hi"/><text x="665" y="148.5" text-anchor="middle" class="fig-t">외부 연동</text><text x="665" y="163.5" text-anchor="middle" class="fig-t sub">고객 측 작업 포함</text><text x="815" y="140" text-anchor="middle" class="fig-m">문서로 판단 안 됨</text><text x="815" y="156" text-anchor="middle" class="fig-m">→ 개발팀 질문으로</text></svg>