<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="LLM 계열 서빙에서 자동 확장의 큐 신호가 0으로 남는 이유와 Triton과의 차이" viewBox="0 0 880 230" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l8a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l8a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l8a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><text x="30" y="30" text-anchor="start" class="fig-m">LLM 계열 (vLLM 기반)</text><rect x="30" y="50" width="100" height="50" rx="6" class="fig-box "/><text x="80" y="79" text-anchor="middle" class="fig-t">요청 다수</text><polyline points="130,75 170,75" class="fig-l " marker-end="url(#l8a-a)"/><rect x="170" y="50" width="170" height="50" rx="6" class="fig-box "/><text x="255" y="71.5" text-anchor="middle" class="fig-t">게이트웨이</text><text x="255" y="86.5" text-anchor="middle" class="fig-t sub">최대 동시 실행 수: 기본 10</text><polyline points="340,75 410,75" class="fig-l " marker-end="url(#l8a-a)"/><text x="375" y="67" text-anchor="middle" class="fig-lab">최대 10건</text><rect x="410" y="50" width="190" height="50" rx="6" class="fig-box "/><text x="505" y="71.5" text-anchor="middle" class="fig-t">vLLM 엔진</text><text x="505" y="86.5" text-anchor="middle" class="fig-t sub">한 번에 수백 건 배칭</text><polyline points="600,75 670,75" class="fig-l bad" marker-end="url(#l8a-ab)"/><text x="635" y="67" text-anchor="middle" class="fig-lab">대기열 0</text><rect x="670" y="50" width="190" height="50" rx="6" class="fig-box bad"/><text x="765" y="71.5" text-anchor="middle" class="fig-t">자동 확장 (큐 신호)</text><text x="765" y="86.5" text-anchor="middle" class="fig-t sub">신호 0 → 늘지 않음</text><text x="30" y="140" text-anchor="start" class="fig-m">Triton</text><rect x="30" y="160" width="100" height="50" rx="6" class="fig-box "/><text x="80" y="189" text-anchor="middle" class="fig-t">요청 다수</text><polyline points="130,185 170,185" class="fig-l " marker-end="url(#l8a-a)"/><rect x="170" y="160" width="170" height="50" rx="6" class="fig-box "/><text x="255" y="181.5" text-anchor="middle" class="fig-t">게이트웨이</text><text x="255" y="196.5" text-anchor="middle" class="fig-t sub">같은 한도</text><polyline points="340,185 410,185" class="fig-l " marker-end="url(#l8a-a)"/><rect x="410" y="160" width="190" height="50" rx="6" class="fig-box "/><text x="505" y="181.5" text-anchor="middle" class="fig-t">Triton 엔진</text><text x="505" y="196.5" text-anchor="middle" class="fig-t sub">한 번에 한 자릿수</text><polyline points="600,185 670,185" class="fig-l hi" marker-end="url(#l8a-ah)"/><text x="635" y="177" text-anchor="middle" class="fig-lab">대기열 생김</text><rect x="670" y="160" width="190" height="50" rx="6" class="fig-box ok"/><text x="765" y="181.5" text-anchor="middle" class="fig-t">자동 확장 (큐 신호)</text><text x="765" y="196.5" text-anchor="middle" class="fig-t sub">신호 상승 → 증설</text></svg>