<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="요청이 몰리는 9시에 자동 확장에 맡긴 경우와 고정 방식으로 미리 늘린 경우의 처리 시점 비교" viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l8b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l8b-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l8b-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><polyline points="150,200 830,200" class="fig-l "/><text x="150" y="220" text-anchor="middle" class="fig-m">08:40</text><text x="320" y="220" text-anchor="middle" class="fig-m">08:50</text><text x="490" y="220" text-anchor="middle" class="fig-lab">09:00 요청 급증</text><text x="660" y="220" text-anchor="middle" class="fig-m">09:08</text><text x="830" y="220" text-anchor="middle" class="fig-m">09:20</text><polyline points="490,60 490,200" class="fig-l dash"/><text x="30" y="80" text-anchor="start" class="fig-m">자동 확장에 맡김</text><rect x="150" y="62" width="340" height="28" rx="3" class="fig-bar ok"/><text x="320" y="80" text-anchor="middle" class="fig-m">인스턴스 1개 처리</text><rect x="490" y="62" width="170" height="28" rx="3" class="fig-bar bad"/><text x="575" y="80" text-anchor="middle" class="fig-m">1개로 버팀 · 지연·실패</text><rect x="660" y="62" width="170" height="28" rx="3" class="fig-bar ok"/><text x="745" y="80" text-anchor="middle" class="fig-m">2개 처리</text><text x="500" y="112" text-anchor="start" class="fig-m">증설 결정 → 가중치 로딩 + 컴파일 6~8분</text><text x="30" y="150" text-anchor="start" class="fig-m">고정 방식 · 사전 증설</text><rect x="150" y="132" width="170" height="28" rx="3" class="fig-bar ok"/><text x="235" y="150" text-anchor="middle" class="fig-m">1개</text><rect x="320" y="132" width="170" height="28" rx="3" class="fig-bar "/><text x="405" y="150" text-anchor="middle" class="fig-m">최소 2로 상향 → 준비 중</text><rect x="490" y="132" width="340" height="28" rx="3" class="fig-bar ok"/><text x="660" y="150" text-anchor="middle" class="fig-m">처음부터 2개 처리</text><text x="480" y="180" text-anchor="end" class="fig-m">08:50에 올려 두면 09:00 전에 준비 완료</text></svg>