<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="데이터셋·평가지표·리더보드·품질 평가·판정·알림으로 이어지는 품질 관리 루프와 그 입력" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="l9-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="l9-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="l9-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="30" y="120" width="130" height="50" rx="6" class="fig-box "/><text x="95" y="141.5" text-anchor="middle" class="fig-t">데이터셋 (골든셋)</text><text x="95" y="156.5" text-anchor="middle" class="fig-t sub">질문 · 정답 · 근거 조항</text><polyline points="160,145 190,145" class="fig-l " marker-end="url(#l9-a)"/><rect x="190" y="120" width="120" height="50" rx="6" class="fig-box "/><text x="250" y="141.5" text-anchor="middle" class="fig-t">평가지표</text><text x="250" y="156.5" text-anchor="middle" class="fig-t sub">코드 · LLM 판정 · 정답</text><polyline points="310,145 340,145" class="fig-l " marker-end="url(#l9-a)"/><rect x="340" y="120" width="120" height="50" rx="6" class="fig-box "/><text x="400" y="141.5" text-anchor="middle" class="fig-t">리더보드</text><text x="400" y="156.5" text-anchor="middle" class="fig-t sub">지표 1~10개로 비교</text><polyline points="460,145 490,145" class="fig-l " marker-end="url(#l9-a)"/><rect x="490" y="120" width="140" height="50" rx="6" class="fig-box hi"/><text x="560" y="141.5" text-anchor="middle" class="fig-t">품질 평가</text><text x="560" y="156.5" text-anchor="middle" class="fig-t sub">합격 기준 · 기준선</text><polyline points="630,145 660,145" class="fig-l " marker-end="url(#l9-a)"/><rect x="660" y="120" width="130" height="50" rx="6" class="fig-box "/><text x="725" y="141.5" text-anchor="middle" class="fig-t">판정</text><text x="725" y="156.5" text-anchor="middle" class="fig-t sub">합격 · 품질저하 · 측정무효</text><polyline points="725,120 725,84" class="fig-l bad" marker-end="url(#l9-ab)"/><text x="735" y="104" text-anchor="start" class="fig-lab">품질저하 · 측정무효</text><rect x="660" y="40" width="130" height="44" rx="6" class="fig-box "/><text x="725" y="58.5" text-anchor="middle" class="fig-t">알림</text><text x="725" y="73.5" text-anchor="middle" class="fig-t sub">시스템 관리자</text><polyline points="560,230 560,170" class="fig-l " marker-end="url(#l9-a)"/><rect x="490" y="230" width="140" height="50" rx="6" class="fig-box "/><text x="560" y="251.5" text-anchor="middle" class="fig-t">자동 실행</text><text x="560" y="266.5" text-anchor="middle" class="fig-t sub">주기 · 변경 감지(지문)</text><text x="560" y="200" text-anchor="middle" class="fig-m">모델·프롬프트 변경 15초 안에 감지</text><polyline points="95,230 95,170" class="fig-l " marker-end="url(#l9-a)"/><text x="88" y="205" text-anchor="end" class="fig-lab">'검증필요' 표시</text><rect x="30" y="230" width="130" height="50" rx="6" class="fig-box "/><text x="95" y="251.5" text-anchor="middle" class="fig-t">근거 문서 갱신·삭제</text><text x="95" y="266.5" text-anchor="middle" class="fig-t sub">AI 드라이브</text><rect x="250" y="230" width="180" height="50" rx="6" class="fig-box "/><text x="340" y="251.5" text-anchor="middle" class="fig-t">운영 신호</text><text x="340" y="266.5" text-anchor="middle" class="fig-t sub">피드백 사유 · 이용 로그 · 대시보드</text><polyline points="340,230 340,200 120,200 120,170" class="fig-l dash" marker-end="url(#l9-a)"/><text x="230" y="192" text-anchor="middle" class="fig-lab">새 질문 유형 → 질문 세트 보강</text></svg>