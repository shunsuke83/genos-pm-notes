</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="d2-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="d2-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="40" width="130" height="44" rx="6" class="fig-box "/><text x="85" y="58.5" text-anchor="middle" class="fig-t">SQL 편집기</text><text x="85" y="73.5" text-anchor="middle" class="fig-t sub">워크스페이스 평면</text><rect x="20" y="96" width="130" height="44" rx="6" class="fig-box "/><text x="85" y="114.5" text-anchor="middle" class="fig-t">JDBC</text><text x="85" y="129.5" text-anchor="middle" class="fig-t sub">외부 BI 도구</text><rect x="20" y="152" width="130" height="44" rx="6" class="fig-box "/><text x="85" y="170.5" text-anchor="middle" class="fig-t">AI 어시스턴트</text><text x="85" y="185.5" text-anchor="middle" class="fig-t sub">Text-to-SQL · 조회만</text><rect x="20" y="208" width="130" height="44" rx="6" class="fig-box "/><text x="85" y="226.5" text-anchor="middle" class="fig-t">MCP · REST · CLI</text><text x="85" y="241.5" text-anchor="middle" class="fig-t sub">에이전트 · 외부 시스템</text><polyline points="150,62 195,120" class="fig-l " marker-end="url(#d2-a)"/><polyline points="150,118 195,135" class="fig-l " marker-end="url(#d2-a)"/><polyline points="150,174 195,160" class="fig-l " marker-end="url(#d2-a)"/><polyline points="150,230 195,175" class="fig-l " marker-end="url(#d2-a)"/><rect x="195" y="96" width="175" height="100" rx="6" class="fig-box hi"/><text x="282.5" y="127.5" text-anchor="middle" class="fig-t">gend-api</text><text x="282.5" y="142.5" text-anchor="middle" class="fig-t sub">신원 전파 · 감사 로그</text><text x="282.5" y="157.5" text-anchor="middle" class="fig-t sub">활성 워크스페이스 스코프</text><text x="282.5" y="172.5" text-anchor="middle" class="fig-t sub">grant 판정 (deny-by-default)</text><polyline points="370,146 400,146" class="fig-l " marker-end="url(#d2-a)"/><rect x="400" y="96" width="160" height="100" rx="6" class="fig-box "/><text x="480" y="127.5" text-anchor="middle" class="fig-t">Trino 코디네이터</text><text x="480" y="142.5" text-anchor="middle" class="fig-t sub">파일 기반 ACL + 신원</text><text x="480" y="157.5" text-anchor="middle" class="fig-t sub">행 필터 · 컬럼 마스킹</text><text x="480" y="172.5" text-anchor="middle" class="fig-t sub">query.max-memory 4GB (운영)</text><polyline points="560,146 610,146" class="fig-l " marker-end="url(#d2-a)"/><rect x="610" y="111" width="110" height="70" rx="6" class="fig-box "/><text x="665" y="135" text-anchor="middle" class="fig-t">워커 1~3</text><text x="665" y="150" text-anchor="middle" class="fig-t sub">HPA</text><text x="665" y="165" text-anchor="middle" class="fig-t sub">per-node 2GB</text><rect x="760" y="30" width="120" height="44" rx="6" class="fig-box "/><text x="820" y="48.5" text-anchor="middle" class="fig-t">sourcedb</text><text x="820" y="63.5" text-anchor="middle" class="fig-t sub">PostgreSQL 커넥터</text><rect x="760" y="86" width="120" height="44" rx="6" class="fig-box "/><text x="820" y="104.5" text-anchor="middle" class="fig-t">oracle_erp</text><text x="820" y="119.5" text-anchor="middle" class="fig-t sub">Oracle 커넥터</text><rect x="760" y="142" width="120" height="44" rx="6" class="fig-box "/><text x="820" y="160.5" text-anchor="middle" class="fig-t">iceberg</text><text x="820" y="175.5" text-anchor="middle" class="fig-t sub">레이크 (SeaweedFS · Ceph)</text><rect x="760" y="198" width="120" height="44" rx="6" class="fig-box "/><text x="820" y="216.5" text-anchor="middle" class="fig-t">tpch</text><text x="820" y="231.5" text-anchor="middle" class="fig-t sub">샘플 카탈로그</text><polyline points="720,130 760,52" class="fig-l " marker-end="url(#d2-a)"/><polyline points="720,140 760,108" class="fig-l " marker-end="url(#d2-a)"/><polyline points="720,152 760,164" class="fig-l " marker-end="url(#d2-a)"/><polyline points="720,162 760,220" class="fig-l " marker-end="url(#d2-a)"/><text x="880" y="266" text-anchor="end" class="fig-m">좌표: 카탈로그.스키마.테이블</text><text x="880" y="286" text-anchor="end" class="fig-m">커넥터 등록 = 카탈로그 추가 · 접속 정보는 Vault</text><text x="20" y="286" text-anchor="start" class="fig-m">조회마다 원본 DB에 부하 · 조인은 Trino 메모리에서 합침</text></svg>