<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="네 입구에서 들어온 질의가 gend-api와 Trino를 거쳐 여러 카탈로그로 나뉘어 실행되는 경로" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
