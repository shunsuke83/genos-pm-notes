</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="d3-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="d3-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="40" width="125" height="44" rx="6" class="fig-box "/><text x="82.5" y="58.5" text-anchor="middle" class="fig-t">파일 업로드</text><text x="82.5" y="73.5" text-anchor="middle" class="fig-t sub">PDF · DOCX · HWP …</text><rect x="20" y="96" width="125" height="44" rx="6" class="fig-box "/><text x="82.5" y="114.5" text-anchor="middle" class="fig-t">폴더 감시 · S3</text><text x="82.5" y="129.5" text-anchor="middle" class="fig-t sub">s3_op</text><rect x="20" y="152" width="125" height="44" rx="6" class="fig-box "/><text x="82.5" y="170.5" text-anchor="middle" class="fig-t">웹 크롤 · REST</text><text x="82.5" y="185.5" text-anchor="middle" class="fig-t sub">web_crawl</text><rect x="20" y="208" width="125" height="44" rx="6" class="fig-box "/><text x="82.5" y="226.5" text-anchor="middle" class="fig-t">DB 소스 · CDC</text><text x="82.5" y="241.5" text-anchor="middle" class="fig-t sub">db_source · Debezium</text><polyline points="145,62 190,125" class="fig-l " marker-end="url(#d3-a)"/><polyline points="145,118 190,135" class="fig-l " marker-end="url(#d3-a)"/><polyline points="145,174 190,145" class="fig-l " marker-end="url(#d3-a)"/><polyline points="145,230 190,155" class="fig-l " marker-end="url(#d3-a)"/><rect x="175" y="30" width="480" height="250" rx="8" class="fig-region "/><text x="185" y="46" class="fig-m">파이프라인 스튜디오 · Dagster 실행</text><rect x="190" y="110" width="100" height="60" rx="6" class="fig-box "/><text x="240" y="129" text-anchor="middle" class="fig-t">파싱</text><text x="240" y="144" text-anchor="middle" class="fig-t sub">builtin.parse</text><text x="240" y="159" text-anchor="middle" class="fig-t sub">OCR · VLM 캡션</text><polyline points="290,140 310,140" class="fig-l " marker-end="url(#d3-a)"/><rect x="310" y="110" width="100" height="60" rx="6" class="fig-box "/><text x="360" y="129" text-anchor="middle" class="fig-t">청킹</text><text x="360" y="144" text-anchor="middle" class="fig-t sub">builtin.chunk</text><text x="360" y="159" text-anchor="middle" class="fig-t sub">정책 · 품질 게이트</text><polyline points="410,140 430,140" class="fig-l " marker-end="url(#d3-a)"/><rect x="430" y="110" width="100" height="60" rx="6" class="fig-box hi"/><text x="480" y="129" text-anchor="middle" class="fig-t">임베딩</text><text x="480" y="144" text-anchor="middle" class="fig-t sub">builtin.embed</text><text x="480" y="159" text-anchor="middle" class="fig-t sub">공급자 바인딩 필요</text><polyline points="530,140 550,140" class="fig-l " marker-end="url(#d3-a)"/><rect x="550" y="110" width="90" height="60" rx="6" class="fig-box "/><text x="595" y="129" text-anchor="middle" class="fig-t">적재</text><text x="595" y="144" text-anchor="middle" class="fig-t sub">builtin.vector</text><text x="595" y="159" text-anchor="middle" class="fig-t sub">builtin.graph</text><text x="190" y="195" text-anchor="start" class="fig-lab">security_level 도장: PUBLIC · CONFIDENTIAL · TOP_SECRET</text><text x="190" y="215" text-anchor="start" class="fig-m">(노드 기본 PUBLIC · 위저드 기본 CONFIDENTIAL · 미지정 판정 CONFIDENTIAL)</text><text x="290" y="245" text-anchor="start" class="fig-lab bad">공급자 없으면 skipped_no_provider → 벡터 없이 구조만 동기화</text><text x="190" y="262" text-anchor="start" class="fig-m">커스텀 전처리 http_api는 비활성 (허용 목록 연동 후 제공)</text><rect x="675" y="40" width="205" height="50" rx="6" class="fig-box "/><text x="777.5" y="61.5" text-anchor="middle" class="fig-t">PostgreSQL · 문서 레코드·메타</text><text x="777.5" y="76.5" text-anchor="middle" class="fig-t sub">PG 뱃지</text><rect x="675" y="115" width="205" height="50" rx="6" class="fig-box hi"/><text x="777.5" y="136.5" text-anchor="middle" class="fig-t">Weaviate 벡터 컬렉션</text><text x="777.5" y="151.5" text-anchor="middle" class="fig-t sub">Vec · yahoo_chunks → YahooChunks</text><rect x="675" y="190" width="205" height="50" rx="6" class="fig-box "/><text x="777.5" y="211.5" text-anchor="middle" class="fig-t">그래프 스토어 (PostgreSQL)</text><text x="777.5" y="226.5" text-anchor="middle" class="fig-t sub">Graph · 스키마 그래프 · 용어집</text><polyline points="640,130 675,65" class="fig-l " marker-end="url(#d3-a)"/><polyline points="640,140 675,140" class="fig-l " marker-end="url(#d3-a)"/><polyline points="640,150 675,215" class="fig-l " marker-end="url(#d3-a)"/><text x="880" y="262" text-anchor="end" class="fig-m">삭제는 타깃까지 전파 · 문서 하나는 한 인스턴스에만</text><text x="20" y="310" text-anchor="start" class="fig-m">확인 화면: 수집 › 문서 (파일별 PG·Vec·Graph 뱃지) · 데이터 관측 › 벡터 인덱스 (컬렉션 PascalCase) · 파이프라인 모니터링 (Dagster)</text></svg>