<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="자연어 질문이 네 단계를 거쳐 조회 SQL로 실행되는 경로와, 에이전트 채팅의 Tier 안전장치" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="d4-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="d4-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="50" width="100" height="50" rx="6" class="fig-box "/><text x="70" y="71.5" text-anchor="middle" class="fig-t">질문</text><text x="70" y="86.5" text-anchor="middle" class="fig-t sub">자연어</text><polyline points="120,75 150,75" class="fig-l " marker-end="url(#d4-a)"/><rect x="150" y="50" width="130" height="50" rx="6" class="fig-box "/><text x="215" y="71.5" text-anchor="middle" class="fig-t">ContextGateway</text><text x="215" y="86.5" text-anchor="middle" class="fig-t sub">전처리 · 컨텍스트</text><polyline points="280,75 310,75" class="fig-l " marker-end="url(#d4-a)"/><rect x="310" y="40" width="180" height="70" rx="6" class="fig-box "/><text x="400" y="64" text-anchor="middle" class="fig-t">AI Orchestrator</text><text x="400" y="79" text-anchor="middle" class="fig-t sub">스키마 그래프 · 용어집 · 이력</text><text x="400" y="94" text-anchor="middle" class="fig-t sub">관련 테이블 10개 · 조인 ≤4홉</text><polyline points="490,75 520,75" class="fig-l " marker-end="url(#d4-a)"/><rect x="520" y="40" width="130" height="70" rx="6" class="fig-box hi"/><text x="585" y="64" text-anchor="middle" class="fig-t">SqlGuard</text><text x="585" y="79" text-anchor="middle" class="fig-t sub">조회문 한 문장만</text><text x="585" y="94" text-anchor="middle" class="fig-t sub">구문 트리 판정 v1.4.2+</text><polyline points="650,75 680,75" class="fig-l " marker-end="url(#d4-a)"/><rect x="680" y="50" width="100" height="50" rx="6" class="fig-box "/><text x="730" y="71.5" text-anchor="middle" class="fig-t">Trino 실행</text><text x="730" y="86.5" text-anchor="middle" class="fig-t sub">grant · 행/열 정책</text><polyline points="780,75 800,75" class="fig-l " marker-end="url(#d4-a)"/><rect x="800" y="50" width="80" height="50" rx="6" class="fig-box "/><text x="840" y="71.5" text-anchor="middle" class="fig-t">결과</text><text x="840" y="86.5" text-anchor="middle" class="fig-t sub">SQL · 설명</text><polyline points="585,110 585,135" class="fig-l bad" marker-end="url(#d4-ab)"/><text x="585" y="148" text-anchor="middle" class="fig-lab bad">UPDATE · DELETE · 두 문장 · CTE 속 변경문 → 거부</text><rect x="20" y="165" width="432" height="120" rx="8" class="fig-region "/><text x="30" y="181" class="fig-m">AI가 '권한 없다'고 답할 때 — 등급 결정 순서</text><rect x="28" y="195" width="100" height="44" rx="6" class="fig-box "/><text x="78" y="213.5" text-anchor="middle" class="fig-t">① 테이블</text><text x="78" y="228.5" text-anchor="middle" class="fig-t sub">직접 지정 등급</text><polyline points="128,217 134,217" class="fig-l " marker-end="url(#d4-a)"/><rect x="134" y="195" width="100" height="44" rx="6" class="fig-box "/><text x="184" y="213.5" text-anchor="middle" class="fig-t">② 워크스페이스</text><text x="184" y="228.5" text-anchor="middle" class="fig-t sub">기본 등급 v1.2.1+</text><polyline points="234,217 240,217" class="fig-l " marker-end="url(#d4-a)"/><rect x="240" y="195" width="100" height="44" rx="6" class="fig-box "/><text x="290" y="213.5" text-anchor="middle" class="fig-t">③ 카탈로그</text><text x="290" y="228.5" text-anchor="middle" class="fig-t sub">기본 등급</text><polyline points="340,217 346,217" class="fig-l " marker-end="url(#d4-a)"/><rect x="346" y="195" width="100" height="44" rx="6" class="fig-box bad"/><text x="396" y="213.5" text-anchor="middle" class="fig-t">④ 없으면</text><text x="396" y="228.5" text-anchor="middle" class="fig-t sub">CONFIDENTIAL</text><text x="28" y="265" text-anchor="start" class="fig-m">호출자 열람 등급 &lt; 데이터 등급이면 결과에서 제외 · 등급 변경은 재로그인 뒤 반영</text><rect x="470" y="165" width="410" height="120" rx="8" class="fig-region "/><text x="480" y="181" class="fig-m">AI 에이전트 채팅 · Tier 안전장치</text><rect x="478" y="195" width="128" height="44" rx="6" class="fig-box ok"/><text x="542" y="213.5" text-anchor="middle" class="fig-t">Tier 1 · 자동</text><text x="542" y="228.5" text-anchor="middle" class="fig-t sub">조회 · 카탈로그 · 검색</text><rect x="612" y="195" width="128" height="44" rx="6" class="fig-box hi"/><text x="676" y="213.5" text-anchor="middle" class="fig-t">Tier 2 · 확인 후 실행</text><text x="676" y="228.5" text-anchor="middle" class="fig-t sub">마트 생성 · 쿼리 저장</text><rect x="746" y="195" width="128" height="44" rx="6" class="fig-box bad"/><text x="810" y="213.5" text-anchor="middle" class="fig-t">Tier 3 · 계획만</text><text x="810" y="228.5" text-anchor="middle" class="fig-t sub">커넥터 · 실행 · 삭제</text><text x="478" y="265" text-anchor="start" class="fig-m">확인 카드에서 [실행]을 누르면 실제로 만들어진다 — 'AI는 읽기만' 은 틀린 말</text><text x="20" y="315" text-anchor="start" class="fig-m">MCP 서버: POST /mcp · JSON-RPC 2.0 · Bearer JWT / Basic 트래킹 키 (v1.3+) / OAuth 디스커버리 (v1.4+) · X-Workspace-Slug</text></svg>