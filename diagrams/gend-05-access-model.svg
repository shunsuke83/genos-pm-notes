<?xml version="1.0" encoding="UTF-8"?>
<svg class="fig" role="img" aria-label="격리 축과 권한 축의 다섯 층, AI 경로의 열람 등급 관문, 그리고 증상으로 층을 가리는 기준" viewBox="0 0 900 335" xmlns="http://www.w3.org/2000/svg"><style>
svg{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#56656F}
text{font-size:12px;fill:#13212B}.fig-t{font-weight:600}.fig-t.sub{font-weight:400;font-size:11px;fill:#56656F}
.fig-m{font-size:11px;fill:#56656F}.fig-lab{font-size:11px;fill:#56656F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fig-lab.bad{fill:#A3302A}
.fig-box{fill:#F7F9FA;stroke:#C9D3D8;stroke-width:1.2}.fig-box.hi{fill:#D9EEEF;stroke:#0E6B73}.fig-box.bad{fill:#F6E0DE;stroke:#A3302A}.fig-box.ok{fill:#E0F0E6;stroke:#2B7549}
.fig-l{fill:none;stroke:#56656F;stroke-width:1.4}.fig-l.hi{stroke:#0E6B73;stroke-width:1.8}.fig-l.bad{stroke:#A3302A;stroke-dasharray:5 4}.fig-l.dash{stroke-dasharray:5 4}
.fig-ah{fill:#56656F}.fig-ah.hi{fill:#0E6B73}.fig-ah.bad{fill:#A3302A}
.fig-region{fill:none;stroke:#C9D3D8;stroke-dasharray:6 4}
.fig-bar{fill:#E6ECEE;stroke:#C9D3D8}.fig-bar.ok{fill:#E0F0E6;stroke:#2B7549}.fig-bar.bad{fill:#F6E0DE;stroke:#A3302A}
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d5-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="d5-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="d5-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="40" width="260" height="40" rx="6" class="fig-box hi"/><text x="150" y="56.5" text-anchor="middle" class="fig-t">L0 워크스페이스 · 격리 축</text><text x="150" y="71.5" text-anchor="middle" class="fig-t sub">Keycloak 그룹 /tenants/&lt;slug> · fail-closed</text><polyline points="150,80 150,90" class="fig-l " marker-end="url(#d5-a)"/><rect x="20" y="90" width="260" height="40" rx="6" class="fig-box "/><text x="150" y="106.5" text-anchor="middle" class="fig-t">L1 부서 (ResourceGroup)</text><text x="150" y="121.5" text-anchor="middle" class="fig-t sub">워크스페이스 안 팀 칸막이</text><polyline points="150,130 150,140" class="fig-l " marker-end="url(#d5-a)"/><rect x="20" y="140" width="260" height="40" rx="6" class="fig-box "/><text x="150" y="156.5" text-anchor="middle" class="fig-t">L2 역할</text><text x="150" y="171.5" text-anchor="middle" class="fig-t sub">admin · analyst · viewer · ws-admin</text><polyline points="150,180 150,190" class="fig-l " marker-end="url(#d5-a)"/><rect x="20" y="190" width="260" height="40" rx="6" class="fig-box "/><text x="150" y="206.5" text-anchor="middle" class="fig-t">L3 DataGrant</text><text x="150" y="221.5" text-anchor="middle" class="fig-t sub">catalog / schema / table · deny-by-default</text><polyline points="150,230 150,240" class="fig-l " marker-end="url(#d5-a)"/><rect x="20" y="240" width="260" height="40" rx="6" class="fig-box "/><text x="150" y="256.5" text-anchor="middle" class="fig-t">L4 ABAC</text><text x="150" y="271.5" text-anchor="middle" class="fig-t sub">row_filter · column_mask (Trino 적용)</text><text x="20" y="300" text-anchor="start" class="fig-m">카탈로그에 보여도 SELECT grant가 없으면 403 — 설계상 정상</text><rect x="320" y="40" width="240" height="60" rx="6" class="fig-box hi"/><text x="440" y="59" text-anchor="middle" class="fig-t">AI 경로 추가 관문 · 열람 등급</text><text x="440" y="74" text-anchor="middle" class="fig-t sub">PUBLIC · CONFIDENTIAL · TOP_SECRET</text><text x="440" y="89" text-anchor="middle" class="fig-t sub">호출자 clearance ≥ 데이터 등급</text><rect x="320" y="120" width="240" height="50" rx="6" class="fig-box bad"/><text x="440" y="141.5" text-anchor="middle" class="fig-t">등급 미지정 데이터</text><text x="440" y="156.5" text-anchor="middle" class="fig-t sub">= CONFIDENTIAL (fail-closed)</text><rect x="320" y="190" width="240" height="50" rx="6" class="fig-box "/><text x="440" y="211.5" text-anchor="middle" class="fig-t">admin도 예외 없음</text><text x="440" y="226.5" text-anchor="middle" class="fig-t sub">등급 변경은 재로그인 뒤 반영</text><polyline points="280,260 300,260 300,70 320,70" class="fig-l dash" marker-end="url(#d5-a)"/><text x="320" y="265" text-anchor="start" class="fig-m">대상 3종: 카탈로그 · 테이블 · 벡터 컬렉션</text><rect x="600" y="30" width="280" height="258" rx="8" class="fig-region "/><text x="610" y="46" class="fig-m">증상으로 층 가리기</text><rect x="612" y="58" width="256" height="44" rx="6" class="fig-box "/><text x="740" y="76.5" text-anchor="middle" class="fig-t">메뉴가 안 보인다</text><text x="740" y="91.5" text-anchor="middle" class="fig-t sub">역할 부족 / 메뉴 표시 설정 v1.4.4 / 모듈 꺼짐</text><rect x="612" y="112" width="256" height="44" rx="6" class="fig-box "/><text x="740" y="130.5" text-anchor="middle" class="fig-t">보이는데 403</text><text x="740" y="145.5" text-anchor="middle" class="fig-t sub">grant 없음 · 네임스페이스 바인딩 · 워크스페이스</text><rect x="612" y="166" width="256" height="44" rx="6" class="fig-box hi"/><text x="740" y="184.5" text-anchor="middle" class="fig-t">화면·SQL은 되는데 AI만 거부</text><text x="740" y="199.5" text-anchor="middle" class="fig-t sub">열람 등급 (접근 권한 아님)</text><rect x="612" y="220" width="256" height="44" rx="6" class="fig-box "/><text x="740" y="238.5" text-anchor="middle" class="fig-t">사용자마다 결과가 다르다</text><text x="740" y="253.5" text-anchor="middle" class="fig-t sub">행 필터 · 컬럼 마스크 · 등급 차이</text><text x="612" y="280" text-anchor="start" class="fig-lab">거부 응답의 reason_code (v1.3.1+)부터 본다</text><text x="20" y="325" text-anchor="start" class="fig-m">감사: 전체 API 요청 → OpenSearch gend-audit* · PII: Presidio 탐지 → 관리자 확인 → 마스킹 뷰 · 망: NetworkPolicy default-deny · Linkerd mTLS</text></svg>