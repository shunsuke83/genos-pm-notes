</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d6a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah "/></marker><marker id="d6a-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah hi"/></marker><marker id="d6a-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ah bad"/></marker></defs><rect x="20" y="30" width="560" height="250" rx="8" class="fig-region "/><text x="30" y="46" class="fig-m">온프렘 kubeadm 클러스터 · 노드 3대 이상 (Ubuntu 22.04/24.04 · 8코어/32GB+ · raw 디스크 1개)</text><rect x="40" y="58" width="172" height="122" rx="6" class="fig-box "/><text x="126" y="93" text-anchor="middle" class="fig-t">노드 1</text><text x="126" y="108" text-anchor="middle" class="fig-t sub">Rook-Ceph OSD · etcd</text><text x="126" y="123" text-anchor="middle" class="fig-t sub">GenD 파드 ~60 (gend·monitoring)</text><text x="126" y="138" text-anchor="middle" class="fig-t sub">GenOS 파드 (동거 시)</text><text x="126" y="153" text-anchor="middle" class="fig-t sub">max-pods 110 → 250 권고</text><rect x="222" y="58" width="172" height="122" rx="6" class="fig-box "/><text x="308" y="93" text-anchor="middle" class="fig-t">노드 2</text><text x="308" y="108" text-anchor="middle" class="fig-t sub">Rook-Ceph OSD · etcd</text><text x="308" y="123" text-anchor="middle" class="fig-t sub">gend-api 2~10 · Trino 워커 1~3</text><text x="308" y="138" text-anchor="middle" class="fig-t sub">GenOS 파드 (동거 시)</text><text x="308" y="153" text-anchor="middle" class="fig-t sub">PDB · ResourceQuota 공유</text><rect x="404" y="58" width="172" height="122" rx="6" class="fig-box hi"/><text x="490" y="93" text-anchor="middle" class="fig-t">GPU 노드</text><text x="490" y="108" text-anchor="middle" class="fig-t sub">gpu-operator MIG 통째 모드</text><text x="490" y="123" text-anchor="middle" class="fig-t sub">프로파일 이름 = 테넌트 경계</text><text x="490" y="138" text-anchor="middle" class="fig-t sub">GenOS 원장은 GenD 사용 못 봄</text><text x="490" y="153" text-anchor="middle" class="fig-t sub">ADR-0066 (제안)</text><rect x="40" y="195" width="255" height="40" rx="6" class="fig-box "/><text x="167.5" y="211.5" text-anchor="middle" class="fig-t">Harbor 레지스트리</text><text x="167.5" y="226.5" text-anchor="middle" class="fig-t sub">에어갭 번들 이미지 적재 load-airgap-images.sh</text><rect x="305" y="195" width="255" height="40" rx="6" class="fig-box "/><text x="432.5" y="211.5" text-anchor="middle" class="fig-t">Ceph RGW (S3 호환)</text><text x="432.5" y="226.5" text-anchor="middle" class="fig-t sub">SeaweedFS · Iceberg 웨어하우스 · 백업</text><text x="40" y="262" text-anchor="start" class="fig-m">검증된 조합: 폐쇄망 · 단일 노드 · 번들 단독 리허설 34회 + GenOS 위 동거 설치</text><rect x="610" y="30" width="270" height="250" rx="8" class="fig-region "/><text x="620" y="46" class="fig-m">동거에서 실측된 충돌 (ADR-0048 · 제안)</text><rect x="622" y="58" width="246" height="42" rx="6" class="fig-box bad"/><text x="745" y="75.5" text-anchor="middle" class="fig-t">CPU 쿼터 고갈 → PDB</text><text x="745" y="90.5" text-anchor="middle" class="fig-t sub">노드 drain 불가 → 업그레이드 실패</text><rect x="622" y="108" width="246" height="42" rx="6" class="fig-box bad"/><text x="745" y="125.5" text-anchor="middle" class="fig-t">알람 채널 충돌</text><text x="745" y="140.5" text-anchor="middle" class="fig-t sub">Alertmanager 라우팅</text><rect x="622" y="158" width="246" height="42" rx="6" class="fig-box bad"/><text x="745" y="175.5" text-anchor="middle" class="fig-t">vCPU 쿼터 · DaemonSet 공유</text><text x="745" y="190.5" text-anchor="middle" class="fig-t sub">falco · Prometheus 클러스터당 하나</text><rect x="622" y="208" width="246" height="42" rx="6" class="fig-box ok"/><text x="745" y="225.5" text-anchor="middle" class="fig-t">권고: 전용 노드풀 + taint</text><text x="745" y="240.5" text-anchor="middle" class="fig-t sub">가능하면 클러스터 분리</text><rect x="20" y="298" width="860" height="40" rx="6" class="fig-box "/><text x="450" y="314.5" text-anchor="middle" class="fig-t">매체 반입 = 에어갭 번들 (이미지·차트) + 소스 트리 (설치 스크립트 infra/scripts) — 둘 다 실어야 Phase 1~9 시작</text><text x="450" y="329.5" text-anchor="middle" class="fig-t sub">온프렘 v1.4.2~v1.4.4는 KServe 미포함 → 실시간 모델 서빙 미제공 · Falco는 에어갭에서 꺼짐</text></svg>